# matrix_groups: structural questions about matrix groups generated by each member.
# A member of the subsets family is a list of flattened square matrices, one matrix per row.

[module]
name = "matrix_groups"
version = 1
summary = "Structure of matrix groups over F_p supplied as subsets of a generator dictionary: order, irreducibility, absolute irreducibility, invariant bilinear forms, and imprimitivity. Vectors act on the right."
lean = "lean"
contract = "lean/Matrix_groups/Contract.lean"
reference = "lean/Matrix_groups/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[operations]]
name = "order"
value = "integer"
families = ["subsets"]
summary = "Order of the subgroup of GL(n,p) generated by the member's flattened n x n matrices."

[[operations]]
name = "is_irreducible"
value = "boolean"
families = ["subsets"]
summary = "Whether F_p^n has no nonzero proper subspace invariant under every generator."

[[operations]]
name = "is_absolutely_irreducible"
value = "boolean"
families = ["subsets"]
summary = "Whether the representation stays irreducible over an algebraic closure. Equivalently here: it is irreducible and its commuting algebra consists only of scalar matrices."

[[operations]]
name = "preserves_form"
value = "boolean"
families = ["subsets"]
summary = "Whether there is a nondegenerate bilinear form B with A B A^T = B for every generator A, using the right-row action v -> v A."

[[operations]]
name = "is_imprimitive"
value = "boolean"
families = ["subsets"]
summary = "Whether the group is irreducible and permutes a direct-sum decomposition into more than one equal-dimensional proper subspace."

[[backends]]
name = "generic"
sources = ["backends/generic/matrix_groups_generic.cpp"]
accepts = "subsets of flattened n x n matrices over any prime p < 2^32"
summary = "Portable C++: group order by a Schreier stabilizer chain on basis vectors; invariant-subspace, commuting-algebra, invariant-form, and block-system searches by finite-field elimination. Members run in parallel."

[[rejections]]
case = "explicit generators"
error = "subsets families only"

[[rejections]]
case = "nonsquare dictionary"
error = "perfect square"

[[rejections]]
case = "singular dictionary"
error = "not an invertible"
