# coset_enumeration: bounded Todd-Coxeter enumeration for presentations whose last relator varies.

[module]
name = "coset_enumeration"
version = 1
summary = "Bounded Todd-Coxeter enumeration for presentations using the words_and_growth equation encoding. A relation row is [left_length, right_length, left..., right..., padding...], where padding is 2*generators; family member w adds the equation w = 1. Letter 2*i is generator i and 2*i+1 its inverse. Subgroup rows are words with trailing 2*generators padding. The deterministic Felsch scan processes subgroup words first, then live cosets, relators, and generators in increasing order. A zero index or missing representation means the table did not close within max_cosets allocated rows; it does not prove infinite index."
lean = "lean"
contract = "lean/Coset_enumeration/Contract.lean"
reference = "lean/Coset_enumeration/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[kinds]]
name = "coset_enumeration.representations"
params = ["count", "generators", "max_cosets"]
payload = "u32 degrees[count], then count*generators*max_cosets u32 images. A completed degree-d action uses the first d entries of each generator block and zero padding; degree 0 means the bound was exhausted."
lean = "representation"
summary = "One optional canonical coset action per presentation. A completed member is the list of generator permutations on cosets numbered by the least allocated table row in each coincidence class."

[[operations]]
name = "index"
value = "integer"
args = { generators = "int", max_cosets = "int", relations = "vectors", subgroup = "vectors" }
families = ["words"]
summary = "Index of the subgroup generated by subgroup when the table closes within max_cosets allocated rows; 0 otherwise. Relations use the words_and_growth equation encoding. Subgroup rows may end in 2*generators padding."

[[operations]]
name = "permutation_representation"
value = "coset_enumeration.representations"
args = { generators = "int", max_cosets = "int", relations = "vectors", subgroup = "vectors" }
families = ["words"]
summary = "Generator permutations for the right action on left subgroup cosets. Cosets follow the least allocated table row in each coincidence class; an incomplete member is none."

[[operations]]
name = "is_finite"
value = "boolean"
args = { generators = "int", max_cosets = "int", relations = "vectors" }
families = ["words"]
summary = "Whether the trivial-subgroup table closes within max_cosets allocated rows. Relations use the words_and_growth equation encoding. True proves the presented group finite; false only records exhaustion of this bound."

[[backends]]
name = "generic"
sources = ["backends/generic/coset_enumeration_generic.cpp"]
accepts = "words(2*generators, length), natural-number equation rows, natural-number subgroup words, 1 <= generators < 2^31, and 1 <= max_cosets < 2^32"
summary = "Portable C++: deterministic Felsch-style Todd-Coxeter tables with two-sided relator scans, least-row coincidence representatives, and parallel enumeration across presentation members."

[[rejections]]
case = "wrong alphabet"
error = "alphabet"

[[rejections]]
case = "relation has an invalid symbol"
error = "symbol"

[[rejections]]
case = "zero bound"
error = "max_cosets"

[[rejections]]
case = "range is not presentations"
error = "words"

[[rejections]]
case = "C3 presentations"
op = "permutation_representation"
reduction = "count"
error = "does not accept"
