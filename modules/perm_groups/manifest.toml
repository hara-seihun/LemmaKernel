# perm_groups: permutation groups whose generators are the rows of each family member.

[module]
name = "perm_groups"
version = 1
summary = "Schreier-Sims for permutation groups: order, membership, transitivity, primitivity, point orbits, and a deterministic base with strong generators. A group member is a nonempty matrix of permutation rows. Use `subsets` on an `orbits.perms` dictionary for every k-generated subgroup, or select the full dictionary for one explicit group. Point-orbit labels are their least points. The BSGS uses the least moved point at each level, sorted generators, breadth-first Schreier transversals, and lexicographically sorted deduplicated strong generators."
lean = "lean"
contract = "lean/Perm_groups/Contract.lean"
reference = "lean/Perm_groups/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[kinds]]
name = "perm_groups.partition"
params = ["count", "n"]
payload = "count*n u32 labels; label i is the least point in i's orbit"
lean = "partition"
summary = "One point-orbit partition per group, encoded by the least point in each orbit."

[[kinds]]
name = "perm_groups.bsgs"
params = ["count", "n"]
payload = "u64 base_offsets[count+1], u64 strong_offsets[count+1], then u32 base points, then strong permutations (n u32 entries each)"
lean = "bsgs"
summary = "Per group: a greedy base and one lexicographically sorted strong generating set."

[[operations]]
name = "order"
value = "integer"
families = ["subsets", "explicit"]
summary = "Order of the group generated by the member's permutation rows, computed from the stabilizer-chain orbit sizes."

[[operations]]
name = "contains"
value = "boolean"
args = { target = "perms" }
families = ["subsets", "explicit"]
summary = "Whether the group contains `target`, which must contain exactly one permutation of the same degree."

[[operations]]
name = "is_transitive"
value = "boolean"
families = ["subsets", "explicit"]
summary = "Whether the generated group is transitive on 0..n-1."

[[operations]]
name = "is_primitive"
value = "boolean"
families = ["subsets", "explicit"]
summary = "Whether the generated group is transitive and preserves no nontrivial partition of 0..n-1."

[[operations]]
name = "orbit_partition"
value = "perm_groups.partition"
families = ["subsets", "explicit"]
summary = "Point-orbit labels: point i is labelled by the least point in its orbit."

[[operations]]
name = "base_and_strong_generators"
value = "perm_groups.bsgs"
families = ["subsets", "explicit"]
summary = "A deterministic BSGS. Repeatedly choose the least point moved by the current stabilizer; use sorted generators and breadth-first Schreier transversals; return the union of level generators sorted lexicographically with duplicates and identity removed."

[[backends]]
name = "generic"
sources = ["backends/generic/perm_groups_generic.cpp"]
accepts = "permutation-valued subsets and explicit families; group orders fitting in u64"
summary = "Portable C++ Schreier-Sims stabilizer chains, parallel over family members; no group closure for order or membership."

[[rejections]]
case = "matrix rows are not permutations"
error = "permutation rows"

[[rejections]]
case = "two membership targets"
error = "exactly one permutation"

[[rejections]]
case = "wrong-degree membership target"
error = "same degree"
