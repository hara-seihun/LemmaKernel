# simplicial_complexes: homology and combinatorics of simplicial complexes over prime fields.
# This file is the only declaration of the module (see modules/gfp/manifest.toml for the rules).
#
# A member is a 0/1 matrix over F_2: row r stands for the set S_r of columns where it is 1, and
# the vertex set is 0..cols-1. Two readings of those sets are supported, chosen per request by
# the `nonfaces` argument:
#
#   nonfaces = 0   the rows generate the complex: its faces are the subsets of the rows,
#                  Delta = { T : T subset of S_r for some r }. `subsets` of a dictionary of
#                  faces is then "every complex generated by k of these faces".
#   nonfaces = 1   the rows are forbidden: Delta = { T : no S_r is contained in T }. Rows of
#                  weight two are the edges of a graph and Delta is its independence complex,
#                  so `subsets` of the pairs of a vertex set is "the independence complex of
#                  every graph with k edges".
#
# Everywhere below, a face is a *nonempty* set in Delta and f_i counts the faces of i+1
# vertices, so homology is unreduced simplicial homology: beta_0 counts connected components.
# The boundary map is the usual one, d[v_0 < ... < v_i] = sum_j (-1)^j [v_0 ... v_j omitted ...],
# and beta_i = f_i - rank(d_i) - rank(d_{i+1}) with ranks taken over F_p, so the answer sees
# p-torsion: the 6-vertex triangulation of the projective plane has beta_1 = 1 over F_2 and 0
# over F_3.

[module]
name = "simplicial_complexes"
version = 1
summary = "Simplicial complexes carried by 0/1 matrices over F_2: each row is a face that generates the complex (nonfaces=0) or a forbidden set that cuts it out (nonfaces=1, weight-2 rows giving the independence complex of a graph). Faces are the nonempty sets of the complex, so homology is unreduced: betti(p, i) = f_i - rank(boundary_i) - rank(boundary_{i+1}) over F_p, and f_count(i) is the i-th entry of the f-vector. euler_characteristic returns the alternating sum of the f-vector reduced modulo p, in [0, p), because the runtime's integer channel is unsigned. is_shellable is shellability in the sense of Bjorner-Wachs, non-pure allowed: some ordering F_1, ..., F_t of the facets has, for every j > 1 and i < j, some k < j with F_i n F_j subset of F_k and |F_j \\ F_k| = 1; a complex with at most one facet is shellable."
lean = "lean"
contract = "lean/Simplicial_complexes/Contract.lean"
reference = "lean/Simplicial_complexes/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[operations]]
name = "f_count"
value = "integer"
args = { dim = "int", nonfaces = "int" }
summary = "f_dim: the number of faces with dim+1 vertices. Zero above the dimension of the complex, so the f-vector is this operation over dim = 0, 1, 2, ..."

[[operations]]
name = "faces"
value = "integer"
args = { nonfaces = "int" }
summary = "The number of nonempty faces, the sum of the f-vector."

[[operations]]
name = "euler_characteristic"
value = "integer"
args = { nonfaces = "int", p = "int" }
summary = "The Euler characteristic sum_i (-1)^i f_i reduced modulo the prime p, in [0, p). Integers cross the boundary unsigned, so a signed answer needs p above the range in play: with p = 65537 a value v > p/2 means the characteristic v - p."

[[operations]]
name = "betti"
value = "integer"
args = { dim = "int", nonfaces = "int", p = "int" }
summary = "dim_{F_p} H_dim(Delta; F_p) for unreduced simplicial homology: f_dim - rank(boundary_dim) - rank(boundary_{dim+1}) over F_p, with boundary_0 = 0. beta_0 is the number of connected components; beta_dim is 0 above the dimension of the complex."

[[operations]]
name = "is_shellable"
value = "boolean"
args = { nonfaces = "int" }
summary = "Whether the facets admit a shelling order in the sense of Bjorner-Wachs (non-pure allowed): an order F_1, ..., F_t such that for every j > 1 and every i < j there is k < j with F_i n F_j contained in F_k and |F_j \\ F_k| = 1. Complexes with at most one facet, including the void complex, are shellable."

[[backends]]
name = "generic"
sources = ["backends/generic/simplicial_complexes_generic.cpp"]
accepts = "families of 0/1 matrices over F_2 with at most 64 columns; any prime p < 2^32; at most 2^22 faces per member; boundary matrices of at most 2^24 entries; at most 20 facets for is_shellable"
summary = "Portable C++: faces as 64-bit vertex masks, enumerated by submask walk (nonfaces=0) or by depth-first extension that never leaves the complex (nonfaces=1), sorted so each dimension is a contiguous block; boundary matrices are eliminated as bitsets over F_2 and densely over any other prime, and shellability is a memoised search over subsets of the facets. Threaded over members."

# Requests that must be refused. `case` names a case from cases.py; `op`/`reduction` override
# the case's own. `error` is a substring of the runtime's message.
[[rejections]]
case = "graphs over F_3"
error = "over F_2"

[[rejections]]
case = "nonfaces flag out of range"
error = "nonfaces must be 0 or 1"

[[rejections]]
case = "composite modulus"
error = "prime"

[[rejections]]
case = "triangles on 5 vertices"
op = "is_shellable"
reduction = "histogram"
error = "does not accept"

[[rejections]]
case = "triangles on 5 vertices"
op = "betti"
reduction = "count"
error = "does not accept"
