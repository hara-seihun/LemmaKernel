# orbits: finite groups acting on families, and one representative per orbit.
# This file is the only declaration of the module (see modules/gfp/manifest.toml for the rules).

[module]
name = "orbits"
version = 1
summary = "Finite permutation and matrix groups acting on families: canonical representatives, orbit sizes, stabilisers, fixed points (Burnside), induced point actions."
lean = "lean"
contract = "lean/Orbits/Contract.lean"
reference = "lean/Orbits/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

# A group is given by generators. Two forms are understood:
#   orbits.perms      permutations of n points; acts on `subsets` families by permuting the
#                     dictionary indices (n must equal the dictionary size)
#   gfp.matrix        a batch of n x n matrices over F_p; acts on `grassmannian(p, n, h)` by
#                     W -> rowspace(W A) and on `all_matrices(p, rows, n)` by M -> M A
# The action on a family is a permutation of its member indices; the canonical representative
# of an orbit is the member with the least index. That is the whole definition, for every family.

[[kinds]]
name = "orbits.perms"
params = ["n", "count"]
payload = "count*n u32 point indices; element g maps point i to entry g*n+i"
lean = "perm"
summary = "A batch of `count` permutations of {0..n-1}. As a group argument, the generators."

[[operations]]
name = "is_canonical"
value = "boolean"
args = { group = "group" }
families = ["subsets", "subsets_of", "grassmannian", "all_matrices"]
summary = "The member has the least index in its orbit under `group`. With `hits`, the orbit transversal; with `count`, the number of orbits."

[[operations]]
name = "canonical_index"
value = "integer"
args = { group = "group" }
families = ["subsets", "subsets_of", "grassmannian", "all_matrices"]
summary = "The least index in the member's orbit under `group`."

[[operations]]
name = "orbit_size"
value = "integer"
args = { group = "group" }
families = ["subsets", "subsets_of", "grassmannian", "all_matrices"]
summary = "Number of members in the orbit of the member under `group`."

[[operations]]
name = "stabilizer_order"
value = "integer"
args = { group = "group" }
families = ["subsets", "subsets_of", "grassmannian", "all_matrices"]
summary = "Order of the stabiliser of the member in `group`, i.e. |group| / orbit_size. Needs the group order, so `group` must generate a group the backend can enumerate."

[[operations]]
name = "fixed_points"
value = "integer"
args = { on = "family" }
families = ["group_elements"]
summary = "For each group element, the number of members of the family `on` it fixes. Sum over the group divided by the group order is the number of orbits (Burnside), an independent check of is_canonical/count."

[[operations]]
name = "projective_action"
value = "orbits.perms"
args = { points = "vectors" }
families = ["explicit"]
summary = "For each n x n matrix A of the batch, the permutation of the projective points `points` (a dictionary of 1 x n rows, each scaled so its first nonzero entry is 1, pairwise distinct) induced by v -> normalise(v A). Fails if the dictionary is not closed under some A. Bridges matrix groups to `subsets` families over projective points."

[[backends]]
name = "generic"
sources = ["backends/generic/orbits_generic.cpp"]
accepts = "any group given by generators; orbits computed by breadth-first search per member; group order by closure up to 2^26 elements"
summary = "Portable C++: per-member orbit BFS over the generators with index ranking through the family's unrank/rank, threaded over members; fixed_points on subsets by cycle type (coefficient of x^k in the product of 1 + x^len over cycles). No orderly-generation pruning yet."

# Requests that must be refused. `case` names a case from cases.py; `op`/`reduction` override
# the case's own. `error` is a substring of the runtime's message.
[[rejections]]
case = "C5 on the hexagon"
error = "cannot act on a dictionary"

[[rejections]]
case = "perms on a Grassmannian"
error = "subsets"

[[rejections]]
case = "2x2 matrices on PG(2,2)"
error = "n x n"

[[rejections]]
case = "singular matrix on PG(1,2)"
error = "singular"

[[rejections]]
case = "points not closed"
error = "outside the dictionary"

[[rejections]]
case = "D6 on 2-subsets"
op = "is_canonical"
reduction = "histogram"
error = "does not accept"

[[rejections]]
case = "fixed_points on a subsets family"
error = "families"
