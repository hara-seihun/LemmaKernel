# quadratic_forms: invariants of symmetric forms over odd prime fields.

[module]
name = "quadratic_forms"
version = 1
summary = "Symmetric bilinear forms and Q(x)=x^T A x over odd prime fields. Type codes are 0 hyperbolic, 1 elliptic, and 2 parabolic; for a degenerate form the type and Witt index refer to its nonsingular quotient. Characteristic 2 is rejected because quadratic forms there are not represented by symmetric matrices. Hermitian forms are not included because the runtime has no finite-field involution in its matrix encoding."
lean = "lean"
contract = "lean/Quadratic_forms/Contract.lean"
reference = "lean/Quadratic_forms/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[operations]]
name = "form_type"
value = "integer"
families = ["explicit", "symmetric_matrices"]
summary = "Type of the nonsingular quotient: 0 for hyperbolic (including rank zero), 1 for elliptic, and 2 for parabolic. Even rank 2m is hyperbolic exactly when (-1)^m times its discriminant is a square; odd rank is parabolic."

[[operations]]
name = "rank"
value = "integer"
families = ["explicit", "symmetric_matrices"]
summary = "Rank of the symmetric Gram matrix, equivalently the rank of the associated bilinear form."

[[operations]]
name = "radical"
value = "gfp.basis"
families = ["explicit", "symmetric_matrices"]
summary = "Canonical basis of the radical ker(A): one vector per free column f of rref(A), in increasing f, with x_f=1 and x_pivot_i=-R[i,f]."

[[operations]]
name = "witt_index"
value = "integer"
families = ["explicit", "symmetric_matrices"]
summary = "Number of hyperbolic planes in the nonsingular quotient. It does not include the radical dimension."

[[operations]]
name = "is_isometric"
value = "boolean"
args = { other = "vectors" }
families = ["explicit", "symmetric_matrices"]
summary = "Whether the member and the fixed symmetric matrix `other` are isometric over F_p. `other` is one n x n matrix. Exact isometry is used, so odd-rank forms with different discriminant square classes are not isometric even though both have parabolic type."

[[operations]]
name = "isotropic_point_count"
value = "integer"
families = ["explicit", "symmetric_matrices"]
summary = "Number of projective points [x] with x nonzero and x^T A x=0, including points in the radical."

[[backends]]
name = "generic"
sources = ["backends/generic/quadratic_forms_generic.cpp"]
accepts = "explicit batches of symmetric square matrices and symmetric_matrices families over odd primes p < 2^32; integer answers must fit u64"
summary = "Portable C++: symmetric congruence elimination classifies each form; radicals use canonical finite-field row reduction. Members run in parallel."

[[rejections]]
case = "characteristic two"
error = "odd prime"

[[rejections]]
case = "nonsymmetric explicit form"
error = "symmetric"

[[rejections]]
case = "nonsquare explicit form"
error = "square"

[[rejections]]
case = "wrong-sized comparison form"
error = "same n x n"

[[rejections]]
case = "Grassmannian restrictions not shipped"
error = "defined on explicit, symmetric_matrices"
