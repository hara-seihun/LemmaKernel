# heat_dirichlet: rigorous fixed-point upper bounds on the summands of heat-weighted Dirichlet
# polynomials, the sums that decide whether a heat-flowed zeta zero can sit in a given region.
#
# Members are single natural numbers (a `range` family or an `explicit` batch of 1 x 1
# lk.naturals). Every value is an integer at scale 2^scale that is an upper bound (lower for
# `sigma_lower`) of a real quantity; every rounding is directed, and the algorithm is fixed to the
# last bit so the backend, the naive implementation and the Lean reference return the same
# integer. Real parameters are passed as rationals `x_num / x_den`.
#
# Notation, for t = t_num/t_den in (0, 1/2], sigma = sigma_num/sigma_den (a lower bound on Re s),
# the height y = y_num/y_den in [0, 1], the cutoff N in [N_-, N_+] = [n_minus, n_plus] (the
# polynomial is truncated at N, so beta and alpha keep only the divisors with n/d <= N, and the
# bounds take the worst such set over the cell), the mollifier
# primes chosen by the bitmask `primes` (bit i selects the i-th of 2, 3, 5, 7) with product D,
# and C = c_num/c_den:
#
#   b_n        = exp((t/4) ln^2 n)
#   g(n)       = b_n n^(-sigma)
#   rho_d(n)   = b_{n/d} / b_n
#   pi_d(n)    = min(1, n / (d N_-))^y
#   lambda_d   = prod_{p | d} (-b_p)
#   beta(n)    = sum_{d | gcd(n, D), n/d <= N} lambda_d rho_d(n)
#   alpha(n)   = C sum_{d | gcd(n, D), n/d <= N} lambda_d pi_d(n) rho_d(n)
#   r          = (1 - C N_-^(-y)) / (1 + C N_-^(-y))
#   term(n)    = max(|beta(n) - alpha(n)|, r |beta(n) + alpha(n)|) g(n)
#
# Everything is evaluated at the one height y. A caller certifies every height above y with the
# same value: the partner sum's weight at a greater height is still at most pi_d(n), and Re s only
# grows with the height.
#
# `phase_bound` is the phase-aware bound: write n = m k with m 7-smooth and k coprime to 210, let
# theta = (theta_2, theta_3, theta_5, theta_7) be the phases of p^(-iT) shared by every term and
# psi the phase of the partner sum, and take a general mollifier E(s) = sum_d mu_d d^(-s) on
# 7-smooth d. Then the mollified polynomial is sum_k b_k k^(-sigma) e^(i phi_k) T_k(theta, psi)
# with independent rough phases phi_k, where
#
#   T_k(theta, psi) = sum_m [cS_{m,k} + e^(i psi) cA_{m,k}] e^(i theta(m)),   theta(m) = sum_p v_p(m) theta_p
#   cS_{m,k}        = sum_{d | m, mk/d <= N} mu_d b_{m/d} (m/d)^(eps_k) m^(-sigma),   eps_k = (t/2) ln k
#   cA_{m,k}        = C sum_{d | m, mk/d <= N} mu_d (mk/(d N_-))^y b_{m/d} (m/d)^(eps_k) m^(-sigma)
#
# and dist(E f, (-inf, 0]) >= F(theta, psi) - |E| Z, with
#
#   F(theta, psi)   = dist(T_1(theta, psi), (-inf, 0]) - sum_{k > 1} b_k k^(-sigma) |T_k(theta, psi)|.
#
# The rough k are grouped into the caller's bins [K_i, K_{i+1}); a bin costs W_i max |T| with
# W_i the sum of b_k k^(-sigma) over its rough k, and its coefficients are expanded in eps_k
# about the bin centre k_c = isqrt(K_a K_b) to Taylor order `order` (0 to 3): T_k is enclosed by
# sum_r delta^r / r! |T^(r)| with T^(r) the polynomial whose terms carry (ln j)^r, delta the
# largest |eps_k - eps_c| over the bin, and the remainder (delta ln j)^(order+1) / (order+1)!
# e^(delta ln j) times each term's size charged as a loss. Terms with m > m0 are not evaluated:
# their l1 mass is charged as a loss too, as is any tail polynomial whose weighted low mass is at
# most `prune` (at scale 2^48). A member is a theta box of the grid g2 x g3 x g5 x g7 on the
# torus (a `range` index in mixed radix, or an explicit 1 x 4 multi-index); psi is sampled at
# npsi boxes inside the operation and the value is the minimum over them. The value is a lower
# bound on F over the box, plus `offset`, at scale 2^scale, from the centre value, the gradient
# and the second-order remainder of every polynomial, with terms whose arc over the box exceeds
# a radian enclosed by their rectangle instead. sigma ranges over [sigma_num, sigma_hi_num] /
# sigma_den across the cell. The mollifier is an lk.naturals matrix of rows (d, sign, num, den),
# mu_d = (-1)^sign num / den; the bins are one lk.naturals row 2 = K_0 < K_1 < ... > n_plus.
# With LK_PHASE_DEBUG set the generic backend reports the component count and the loss on stderr.
#
# Arguments to exp above 7 are refused, which keeps every intermediate below 2^63 at scale 2^48.

[module]
name = "heat_dirichlet"
version = 1
summary = "Rigorous fixed-point bounds for heat-weighted Dirichlet polynomials: the weight b_n n^(-sigma), the mollified summand max(|beta - alpha|, r |beta + alpha|) b_n n^(-sigma) at a height y over a range of cutoffs, that summand summed over a block of consecutive n, the lower bound on Re s consumed by the others, and the phase-aware lower bound on dist(E f, (-inf, 0]) over a box of the torus of shared prime phases, which is what the triangle inequality gives up. Members are 1 x 1 natural numbers (boxes may also be 1 x 4); values are integers at scale 2^scale with every rounding directed, so a value is a true bound and the same integer in every implementation. Real parameters are rationals x_num / x_den."

lean = "lean"
contract = "lean/Heat_dirichlet/Contract.lean"
reference = "lean/Heat_dirichlet/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[operations]]
name = "weight_upper"
value = "integer"
args = { t_num = "int", t_den = "int", sigma_num = "int", sigma_den = "int", scale = "int" }
families = ["range", "explicit"]
summary = "An upper bound on 2^scale exp((t/4) ln^2 n - sigma ln n) for the member n >= 1; the heat weight b_n times n^(-sigma)."

[[operations]]
name = "mollified_term_upper"
value = "integer"
args = { t_num = "int", t_den = "int", sigma_num = "int", sigma_den = "int", y_num = "int", y_den = "int", n_minus = "int", n_plus = "int", primes = "int", c_num = "int", c_den = "int", scale = "int" }
families = ["range", "explicit"]
summary = "An upper bound on 2^scale sup term(n) over cutoffs N in [N_-, N_+], for the member n >= 1, where term(n) = max(|beta(n) - alpha(n)|, r |beta(n) + alpha(n)|) b_n n^(-sigma) is the n-th summand of the mollified heat Dirichlet polynomial at height y, with beta, alpha, r as in the module description."

[[operations]]
name = "block_term_upper"
value = "integer"
args = { t_num = "int", t_den = "int", sigma_num = "int", sigma_den = "int", y_num = "int", y_den = "int", n_minus = "int", n_plus = "int", primes = "int", c_num = "int", c_den = "int", n0 = "int", width = "int", scale = "int" }
families = ["range", "explicit"]
summary = "For the member k, an upper bound on 2^scale sup over cutoffs N in [N_-, N_+] of the sum of term(n) over the block n0 + k width <= n < n0 + (k+1) width, obtained without visiting every n: rho_d decreases in n, pi_d increases, and b_n n^(-sigma) is quasi-convex, so the block's ends enclose every summand. Blocks must start at 1 or above."

[[operations]]
name = "phase_bound"
value = "integer"
args = { t_num = "int", t_den = "int", sigma_num = "int", sigma_hi_num = "int", sigma_den = "int", y_num = "int", y_den = "int", n_minus = "int", n_plus = "int", c_num = "int", c_den = "int", g2 = "int", g3 = "int", g5 = "int", g7 = "int", npsi = "int", m0 = "int", order = "int", prune = "int", offset = "int", scale = "int", mollifier = "vectors", bins = "vectors" }
families = ["range", "explicit"]
summary = "For the member theta box of the torus grid g2 x g3 x g5 x g7 (a range index in mixed radix, or a 1 x 4 multi-index), a lower bound on 2^scale (offset + F) rounded down and clamped at 0, where F is the phase-aware bound inf over the box and over psi (sampled at npsi boxes) of dist(T_1, (-inf, 0]) - sum_{k > 1} b_k k^(-sigma) |T_k| of the module description, with the mollifier (rows d, sign, num, den) and the bins of rough k given as lk.naturals arguments, sigma in [sigma_num, sigma_hi_num] / sigma_den, terms above m0 and Taylor remainders in eps past `order` charged as losses, and tail polynomials of weighted mass at most `prune` (scale 2^48) pruned into the loss."

[[operations]]
name = "sigma_lower"
value = "integer"
args = { t_num = "int", t_den = "int", y_num = "int", y_den = "int", scale = "int" }
families = ["range", "explicit"]
summary = "A lower bound on 2^scale ((1 + y)/2 + (t/4) ln(N^2 - 1) - t / (144 (N^2 - 1)^2)) for the member N >= 2, rounded down and clamped at 0: the lower bound on Re s_* at heights y and above across a cell whose x-range starts at x_N = 4 pi N^2 - pi t / 4, so that the other operations may take sigma = value / 2^scale."

[[backends]]
name = "generic"
sources = ["backends/generic/heat_dirichlet_generic.cpp"]
summary = "Portable C++: 128-bit fixed-point arithmetic at scale 2^48 with directed rounding, the per-request constants (lambda_d, d^(-y), r, the cosine table, every bin's coefficient enclosures) computed once, block coefficients computed once per divisor class, members split across threads."
accepts = "every request the module accepts"

[[backends]]
name = "hip"
sources = ["backends/hip/heat_dirichlet_hip.cpp"]
accepts = "phase_bound with npsi <= 128, when liblemmakernel_hip.so (backends/hip/phase_kernel.hip, built by hipcc into liblemmakernel's directory, or LEMMAKERNEL_HIP_LIB) loads and a device is present; preferred over generic"
summary = "AMD GPU: the request's setup as in generic, then one device thread per theta box with the psi loop inside, 64-bit sums and 128-bit products at scale 2^48 with the same directed roundings, so the value equals the generic backend's and the reference's."

[[rejections]]
case = "grassmannian is not a number family"
error = "families only"

[[rejections]]
case = "matrices over F_5 are not numbers"
error = "natural numbers"

[[rejections]]
case = "pairs of numbers are not numbers"
error = "1 x 1"

[[rejections]]
case = "weight of 0"
error = "at least 1"

[[rejections]]
case = "sigma at 1"
error = "at least 2"

[[rejections]]
case = "t above one half"
error = "rational in"

[[rejections]]
case = "exponent too large"
error = "exceeds 7"
