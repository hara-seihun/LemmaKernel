# subgroups: subgroup enumeration for finite permutation groups.

[module]
name = "subgroups"
version = 1
summary = "Subgroups of finite permutation groups. Parent groups and candidate subgroups are supplied by permutation-generator rows. Subgroups are represented by increasing indices into the parent's lexicographically sorted element list. Conjugacy and maximal-subgroup outputs contain one representative per conjugacy class: the lexicographically least index list in the class, with representatives themselves in lexicographic order."
lean = "lean"
contract = "lean/Subgroups/Contract.lean"
reference = "lean/Subgroups/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[kinds]]
name = "subgroups.lists"
params = ["count"]
payload = "u64 group_offsets[count+1], u64 subgroup_offsets[group_offsets[count]+1], then u64 element indices"
lean = "subgroups"
summary = "For each input group, a list of subgroups. Each subgroup is the increasing list of indices of all its elements in the parent's lexicographically sorted closure."

[[operations]]
name = "subgroup_count"
value = "integer"
families = ["subsets", "explicit"]
summary = "Number of distinct subgroups of the permutation group generated by each member."

[[operations]]
name = "conjugacy_classes"
value = "subgroups.lists"
families = ["subsets", "explicit"]
summary = "One representative of every conjugacy class of subgroups. A representative is the lexicographically least increasing element-index list among its conjugates; representatives are returned in lexicographic order."

[[operations]]
name = "maximal_subgroups"
value = "subgroups.lists"
families = ["subsets", "explicit"]
summary = "One representative of every conjugacy class of maximal proper subgroups, with the same canonical ordering as conjugacy_classes."

[[operations]]
name = "is_normal"
value = "boolean"
args = { group = "group" }
families = ["subsets", "explicit"]
summary = "Whether the subgroup generated by the member is contained in and normal in the permutation group argument. A generated subgroup outside the parent returns false."

[[backends]]
name = "generic"
sources = ["backends/generic/subgroups_generic.cpp"]
accepts = "permutation groups of order at most 4096, supplied through subsets or explicit families"
summary = "Portable C++: lexicographic group closure, multiplication tables, and duplicate-free cyclic extension of known subgroups; independent parent groups run in parallel."

[[rejections]]
case = "field matrices are not permutations"
error = "permutation rows"

[[rejections]]
case = "matrix parent for normality"
error = "permutation group"

[[rejections]]
case = "wrong-degree parent"
error = "same degree"
