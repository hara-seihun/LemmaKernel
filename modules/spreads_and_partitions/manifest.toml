# spreads_and_partitions: sets of subspaces of F_p^n, and when they partition it.
# This file is the only declaration of the module (see modules/gfp/manifest.toml for the rules).
#
# How a member is read, once, for every operation here. The ambient dimension `n` is an argument;
# a member is a k x cols matrix over F_p, each of whose k rows is one component, read row-major as
# an h x n matrix with h = cols / n, and standing for the *row space* of that matrix. A row of
# rank d < h means a component of dimension d (pad with zero rows to mix dimensions in one
# family); a row of rank 0 means the zero subspace, which no operation here accepts as a
# component. Nothing assumes the rows are distinct, in echelon form, or independent.
#
# The family this is written for is `subsets_of(grassmannian(p, n, h), k)`: every k-set of
# h-dimensional subspaces of F_p^n, in the Grassmannian's canonical order, each member's k
# subspaces in increasing index order. `subsets` of a chosen dictionary of subspaces (only the
# lines through a point, the spreads found by an earlier call) and `explicit` batches of candidate
# configurations work the same way, as does any other family whose members are matrices over F_p.

[module]
name = "spreads_and_partitions"
version = 1
summary = "Sets of subspaces of F_p^n: partial spreads, spreads, vector space partitions and packings, on families of k-sets of subspaces. Each row of a member is a component, read as an h x n basis with h = cols / n and meaning its row space; every component must be nonzero. A partial spread is a set of components of one dimension meeting pairwise in 0; a spread is a partial spread that covers every nonzero vector; a vector space partition is the same without the equal-dimension requirement; a packing splits every row into m = cols / (n*h) components and asks that every row be a spread by h-subspaces and that the k*m components be every h-subspace of F_p^n exactly once."
lean = "lean"
contract = "lean/Spreads_and_partitions/Contract.lean"
reference = "lean/Spreads_and_partitions/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[operations]]
name = "is_partial_spread"
value = "boolean"
args = { n = "int" }
summary = "The components are nonzero, all of the same dimension, and meet pairwise in 0 only. With `count`, how many k-sets of the family are partial spreads; with `first`, the least one."

[[operations]]
name = "is_spread"
value = "boolean"
args = { n = "int" }
summary = "A partial spread whose components cover every nonzero vector of F_p^n: pairwise trivial meets and k * (p^d - 1) = p^n - 1, so every nonzero vector lies in exactly one component."

[[operations]]
name = "is_vector_space_partition"
value = "boolean"
args = { n = "int" }
summary = "Every nonzero vector of F_p^n lies in exactly one component: nonzero components, pairwise trivial meets, and sum over components of (p^dim - 1) = p^n - 1. Dimensions may differ; on components of one dimension this is `is_spread`."

[[operations]]
name = "intersecting_pairs"
value = "integer"
args = { n = "int" }
summary = "The number of unordered pairs of components (by position, i < j) whose intersection is nonzero. Zero means pairwise trivial meets, which for nonzero components of equal dimension is a partial spread; with `min` over a family, the k-set closest to being one."

[[operations]]
name = "is_packing"
value = "boolean"
args = { n = "int", h = "int" }
summary = "Each row is one spread: it is split into m = cols / (n*h) components of h*n entries each. True when every row is a spread of F_p^n by h-dimensional subspaces and the k*m components are pairwise distinct subspaces numbering the Gaussian binomial [n choose h]_p, so together they are every h-subspace exactly once."

[[backends]]
name = "generic"
sources = ["backends/generic/spreads_generic.cpp"]
accepts = "any p < 2^32; any family of matrices over F_p; any operation"
summary = "Portable C++: depth-first enumeration keeping one echelon basis per component of the prefix, so a k-set is only ever extended while it is still a partial spread; a prefix with two meeting components, a zero component, a dimension change or too much cover is skipped with its whole subtree. Threads over top-level branches. Costs, so the next backend knows what to beat: one elimination of at most h rows per (new component, earlier component) pair, i.e. depth * h reductions per node; for small p^n a bitset of the projective points per component would replace the eliminations with one AND."

# Requests that must be refused. `case` names a case from cases.py; `op`/`reduction` override
# the case's own. `error` is a substring of the runtime's message.
[[rejections]]
case = "ragged ambient dimension"
error = "does not divide"

[[rejections]]
case = "zero ambient dimension"
error = "at least 1"

[[rejections]]
case = "words are not a field"
error = "no available backend"

[[rejections]]
case = "packing block too wide"
error = "does not divide"

[[rejections]]
case = "PG(3,2) candidates"
op = "is_spread"
reduction = "histogram"
error = "does not accept"

[[rejections]]
case = "PG(3,2) candidates"
op = "intersecting_pairs"
reduction = "count"
error = "does not accept integer"
