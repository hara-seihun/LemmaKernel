# quantum_codes: binary symplectic representations of additive GF(4) stabiliser codes.
# This file is the module's only declaration; tools/manifest.py generates the registries and
# bindings from it.

[module]
name = "quantum_codes"
version = 1
summary = "Stabiliser codes represented by binary generator rows (x|z), equivalently additive GF(4) codes under (x,z) -> x + omega*z: symplectic self-orthogonality, distance, and the CSS property. Distance is the least symplectic weight in C^perp_s \\ C, or n+1 when that set is empty."
lean = "lean"
contract = "lean/Quantum_codes/Contract.lean"
reference = "lean/Quantum_codes/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

# Every member is a matrix over F_2 with 2n columns. Its rows generate C <= F_2^(2n). Columns
# are ordered (x_0,...,x_{n-1}|z_0,...,z_{n-1}); symplectic weight counts positions i where
# (x_i,z_i) is nonzero. Row rank and displayed basis do not affect any answer.

[[operations]]
name = "is_self_orthogonal"
value = "boolean"
families = ["explicit", "subsets", "subsets_of", "grassmannian", "all_matrices", "symmetric_matrices", "transform", "stack"]
summary = "Whether C is contained in its symplectic dual: x*z' + z*x' = 0 for every pair of generated codewords."

[[operations]]
name = "distance"
value = "integer"
families = ["explicit", "subsets", "subsets_of", "grassmannian", "all_matrices", "symmetric_matrices", "transform", "stack"]
summary = "The least symplectic weight of v in C^perp_s but not C. Returns n+1, one above every possible weight, when C^perp_s \\ C is empty."

[[operations]]
name = "is_css"
value = "boolean"
families = ["explicit", "subsets", "subsets_of", "grassmannian", "all_matrices", "symmetric_matrices", "transform", "stack"]
summary = "Whether C is generated by X-only and Z-only words, equivalently C = (C intersect (F_2^n|0)) direct-sum (C intersect (0|F_2^n))."

[[backends]]
name = "generic"
sources = ["backends/generic/quantum_codes_generic.cpp"]
accepts = "matrix families over F_2 with an even number 2n of columns"
summary = "Portable C++: bit-packed binary elimination and increasing-weight enumeration of symplectic errors, threaded over family members."

[[rejections]]
case = "nonbinary generators"
error = "over F_2"

[[rejections]]
case = "odd number of columns"
error = "even number"
