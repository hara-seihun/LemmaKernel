# automorphisms: automorphism groups of finite groups given by Cayley tables.

[module]
name = "automorphisms"
version = 1
summary = "Automorphism groups of finite groups: order, canonical generators, holomorph order, and the index of the inner automorphism group."
lean = "lean"
contract = "lean/Automorphisms/Contract.lean"
reference = "lean/Automorphisms/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[kinds]]
name = "automorphisms.generators"
params = ["count", "order"]
payload = "u64 offsets[count+1], then offsets[count]*order u32 images"
lean = "generators"
summary = "For each input group of order n, a ragged list of permutations of 0..n-1. The list is the lexicographically greedy generating set of Aut(G): scan every automorphism in lexicographic order and keep it exactly when the preceding choices do not generate it."

[[operations]]
name = "aut_order"
value = "integer"
families = ["group_tables"]
summary = "The order of the automorphism group Aut(G)."

[[operations]]
name = "aut_generators"
value = "automorphisms.generators"
families = ["group_tables"]
summary = "Canonical generators of Aut(G), acting on Cayley-table labels. Scan all automorphisms lexicographically and keep one exactly when it is outside the subgroup generated by earlier choices."

[[operations]]
name = "holomorph_order"
value = "integer"
families = ["group_tables"]
summary = "The order |Hol(G)| = |G| * |Aut(G)|."

[[operations]]
name = "inner_aut_index"
value = "integer"
families = ["group_tables"]
summary = "The index [Aut(G) : Inn(G)] = |Out(G)|, computed as |Aut(G)| * |Z(G)| / |G|."

[[backends]]
name = "generic"
sources = ["backends/generic/automorphisms_generic.cpp"]
accepts = "every group_tables family whose answers fit in u64"
summary = "Portable C++: enumerate table automorphisms by backtracking partial bijections, close each assignment under multiplication, and split independent input groups across threads."

[[rejections]]
case = "matrix is not a group family"
error = "group_tables"
