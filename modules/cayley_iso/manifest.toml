# cayley_iso: the fixed-valency CI property for finite groups.

[module]
name = "cayley_iso"
version = 2
summary = "Undirected Cayley graph classification for finite groups, at one valency or across every inverse-closed connection set. Connection sets are partitioned both by Aut(G) and by unlabelled graph isomorphism."
lean = "lean"
contract = "lean/Cayley_iso/Contract.lean"
reference = "lean/Cayley_iso/Reference.lean"
naive = "naive/naive.py"
cases = "cases.py"

[[operations]]
name = "aut_class_count"
value = "integer"
args = { k = "int" }
families = ["group_tables"]
summary = "Number of Aut(G)-orbits on inverse-closed identity-free connection sets of cardinality k. Aut(G) acts on the Cayley-table labels."

[[operations]]
name = "iso_class_count"
value = "integer"
args = { k = "int" }
families = ["group_tables"]
summary = "Number of unlabelled graph-isomorphism classes among Cay(G,S) for inverse-closed identity-free connection sets S of cardinality k."

[[operations]]
name = "is_ci"
value = "boolean"
args = { k = "int" }
families = ["group_tables"]
summary = "Whether aut_class_count equals iso_class_count for G and k, equivalently whether every isomorphism between the enumerated Cayley graphs is induced on connection sets by an automorphism of G."

[[operations]]
name = "is_non_ci"
value = "boolean"
args = { k = "int" }
families = ["group_tables"]
summary = "The negation of is_ci. Use the hits reduction to return the group-table members forming non-CI (G,k) pairs; k is the request argument. This separate predicate keeps the shared rule that hits returns true members."

[[operations]]
name = "is_ci_group"
value = "boolean"
args = {}
families = ["group_tables"]
summary = "Whether every isomorphism between simple undirected Cayley graphs of G is induced on connection sets by an automorphism of G. Complementary valencies are identified before enumeration."

[[operations]]
name = "is_non_ci_group"
value = "boolean"
args = {}
families = ["group_tables"]
summary = "The negation of is_ci_group. With hits, returns the non-CI group-table members."

[[backends]]
name = "generic"
sources = ["backends/generic/cayley_iso_generic.cpp"]
accepts = "validated finite group tables; exhaustive inverse-closed connection sets and exact canonical forms"
summary = "Portable C++: generator-first table-automorphism search shared with automorphisms, one representative per Aut(G)-orbit, canonical graph labelling shared with the runtime graph code, and complement symmetry."

[[backends]]
name = "nauty"
sources = ["backends/nauty/cayley_iso_nauty.cpp"]
accepts = "validated finite group tables when LemmaKernel was built with nauty; calls are serialized when the installed nauty library does not provide thread-local state"
summary = "Nauty canonical labelling, parallel across Aut(G)-orbit representatives; otherwise the same exact enumeration as the generic backend."

[[rejections]]
case = "matrix is not a group family"
error = "group_tables"

[[rejections]]
case = "order-four catalogue at k=1"
op = "aut_class_count"
reduction = "count"
error = "does not accept integer"

[[rejections]]
case = "order-four catalogue at k=1"
op = "is_ci"
reduction = "histogram"
error = "does not accept boolean"
