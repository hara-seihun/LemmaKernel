# Runtime-level declarations shared by every module: the families (sets of objects with a
# canonical order, implemented in runtime/src/family.cpp and defined in runtime/lean/Lk) and the
# reductions (how a per-member value comes back). `accepts` lists the value types each reduction
# takes, with "*" for any. `visited` and `family_size` on every non-`all` result are the
# completeness check. Argument types are the vocabulary tools/harness.py renders and generates:
# int, vector, vectors, perms, group, family.

[[families]]
name = "explicit"
member = "gfp.matrix"
lean = "explicit"
summary = "One member per matrix of the batch, in batch order."

[[families]]
name = "subsets"
member = "gfp.matrix"
lean = "subsets"
summary = "Every k-row matrix formed by choosing k rows of the dictionary, indices increasing; lexicographic order of the index tuple."

[[families]]
name = "grassmannian"
member = "gfp.matrix"
lean = "grassmannian"
summary = "Every h-dimensional subspace of F_p^n as its reduced row echelon basis (h x n); ordered by pivot set (lexicographic), then by free entries (row-major, lexicographic)."

[[families]]
name = "all_matrices"
member = "gfp.matrix"
lean = "allMatrices"
summary = "Every rows x cols matrix over F_p; index is the row-major base-p number of the entries."

[[families]]
name = "transform"
member = "gfp.matrix"
lean = "transform"
summary = "Each member M of the inner family replaced by M * C for a fixed matrix C. Same order and indices."

[[families]]
name = "stack"
member = "gfp.matrix"
lean = "stack"
summary = "Each member M of the inner family with a fixed block of rows appended below it. Same order and indices."

[[families]]
name = "group_elements"
member = "orbits.perms"
lean = "groupElements"
summary = "Every element of the permutation group generated by the given orbits.perms, as a 1 x n permutation, in lexicographic order of the image list. Size is the group order."

[[reductions]]
name = "all"
accepts = ["*"]
summary = "Materialise the per-member value for every member, in family order. Integers and booleans come back as kind `integers`."

[[reductions]]
name = "count"
accepts = ["boolean"]
summary = "Number of members whose value is true (kind `count`: value, visited, family_size)."

[[reductions]]
name = "histogram"
accepts = ["integer"]
summary = "Number of members per value (kind `histogram`: u64 bins[0..max])."

[[reductions]]
name = "hits"
accepts = ["boolean"]
args = { limit = "int" }
summary = "Canonical indices of every member whose value is true, and the first `limit` of them materialised (kind `hits`)."
