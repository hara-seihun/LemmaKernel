# Runtime-level declarations shared by every module: the families (sets of objects with a
# canonical order, implemented in runtime/src/family.cpp and defined in runtime/lean/Lk) and the
# reductions (how a per-member value comes back). `accepts` lists the value types each reduction
# takes, with "*" for any. `visited` and `family_size` on every non-`all` result are the
# completeness check. Argument types are the vocabulary tools/harness.py renders and generates:
# int, vector, vectors, perms, group, family.

[[kinds]]
name = "lk.naturals"
params = ["count", "rows", "cols"]
payload = "count*rows*cols u32 natural numbers"
lean = "naturals"
summary = "A batch of natural-number matrices with entries below 2^32."

[[families]]
name = "explicit"
member = "matrix"
lean = "explicit"
summary = "One member per matrix or permutation of the batch, in batch order."

[[families]]
name = "subsets"
member = "matrix"
lean = "subsets"
summary = "Every k-row matrix formed by choosing k rows of a matrix or permutation dictionary, indices increasing; lexicographic order of the index tuple."

[[families]]
name = "grassmannian"
member = "gfp.matrix"
lean = "grassmannian"
summary = "Every h-dimensional subspace of a field with q labelled elements as its reduced row echelon basis (h x n); ordered by pivot set (lexicographic), then by free entries (row-major, lexicographic). The consuming module supplies extension-field arithmetic."

[[families]]
name = "all_matrices"
member = "gfp.matrix"
lean = "allMatrices"
summary = "Every rows x cols matrix with entries 0..q-1; index is the row-major base-q number of the entries."

[[families]]
name = "transform"
member = "gfp.matrix"
lean = "transform"
summary = "Each prime-field member M replaced by M * C for a fixed matrix C. Same order and indices."

[[families]]
name = "stack"
member = "gfp.matrix"
lean = "stack"
summary = "Each member M of the inner family with a fixed block of rows appended below it. Same order and indices."

[[families]]
name = "group_elements"
member = "orbits.perms | gfp.matrix"
lean = "groupElements"
summary = "Every element of the group generated by an orbits.perms batch or invertible square gfp.matrix batch, in lexicographic order of the flat member. Size is the group order."

[[families]]
name = "group_tables"
member = "lk.naturals"
lean = "groupTables"
summary = "Finite groups as n x n Cayley tables with entries in 0..n-1, in stored order. A table batch gives explicit groups or a complete stored catalogue; permutation generators are converted to one table with lexicographically ordered elements."

[[families]]
name = "subsets_of"
member = "gfp.matrix"
lean = "subsetsOf"
summary = "Every k-subset of the members of an inner family, each member flattened to one row of rows*cols entries, indices increasing; lexicographic order of the index tuple. The inner family is materialised once and must have at most 2^22 members."

[[families]]
name = "symmetric_matrices"
member = "gfp.matrix"
lean = "symmetricMatrices"
summary = "Every symmetric n x n matrix with entries 0..q-1; index is the base-q number of the upper triangle read row-major."

[[families]]
name = "range"
member = "lk.naturals"
lean = "range"
summary = "The integers a <= x < b as 1 x 1 natural-number matrices; index is x - a."

[[families]]
name = "words"
member = "lk.naturals"
lean = "words"
summary = "Every word of the given length over the alphabet 0..alphabet-1 as a 1 x length natural-number matrix; index is the base-alphabet number of the word."

[[families]]
name = "partitions"
member = "lk.naturals"
lean = "partitions"
summary = "Partitions of total with optional largest-part, part-count and multiplicity bounds, and optional distinct or odd parts; one decreasing row padded to total entries with zeros, in descending lexicographic order. A zero bound is unrestricted."

[[families]]
name = "compositions"
member = "lk.naturals"
lean = "compositions"
summary = "Positive compositions of total with optional exact length and largest-part bound; one row padded to total entries with zeros. Lengths increase first, then rows are descending lexicographic. A zero bound or length is unrestricted."

[[families]]
name = "standard_tableaux"
member = "lk.naturals"
lean = "standardTableaux"
summary = "Every standard Young tableau of a fixed positive partition shape, padded with zeros to its bounding rectangle. Order recursively places the largest entry in removable corners from the top row down."

[[families]]
name = "all_graphs"
member = "gfp.matrix"
lean = "allGraphs"
summary = "One simple graph from each isomorphism class on 1 <= n <= 8 vertices, represented by its lexicographically least row-major adjacency matrix and ordered lexicographically. Generation adds one vertex at a time and rejects isomorphic augmentations."

[[families]]
name = "edge_subgraphs"
member = "gfp.matrix"
lean = "edgeSubgraphs"
summary = "Every spanning k-edge subgraph of one simple host graph. Host edges are ordered by (u,v) with u < v, and subsets use lexicographic index-tuple order."

[[families]]
name = "cayley_graphs"
member = "gfp.matrix"
lean = "cayleyGraphs"
summary = "Every undirected Cayley graph of a permutation group from an inverse-closed subset of its nonidentity elements. Inverse classes and vertices follow lexicographic permutation order; connection-set bits are lexicographic with the first class slowest."

[[reductions]]
name = "all"
accepts = ["*"]
summary = "Materialise the per-member value for every member, in family order. Integers and booleans come back as kind `integers`."

[[reductions]]
name = "count"
accepts = ["boolean"]
summary = "Number of members whose value is true (kind `count`: value, visited, family_size)."

[[reductions]]
name = "histogram"
accepts = ["integer"]
summary = "Number of members per value (kind `histogram`: u64 bins[0..max])."

[[reductions]]
name = "hits"
accepts = ["boolean"]
args = { limit = "int" }
summary = "Canonical indices of every member whose value is true, and the first `limit` of them materialised (kind `hits`)."

[[reductions]]
name = "first"
accepts = ["boolean"]
summary = "The least canonical index whose value is true, materialised, or found = 0 when there is none (kind `first`). Stops as soon as nothing below the best hit remains; `visited` is index + 1 when found and family_size otherwise."

[[reductions]]
name = "sum"
accepts = ["integer"]
summary = "Sum of the values over the family (kind `count`: value, visited, family_size); fails if it exceeds 2^64 - 1."

[[reductions]]
name = "max"
accepts = ["integer"]
summary = "The largest value and the least index attaining it, materialised (kind `extremum`)."

[[reductions]]
name = "min"
accepts = ["integer"]
summary = "The smallest value and the least index attaining it, materialised (kind `extremum`)."
